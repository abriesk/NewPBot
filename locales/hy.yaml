# locales/hy.yaml
#
# Language code is `hy` (Armenian). The v1.0 deployment used `am`, which is
# Amharic — that code must not appear anywhere in the new codebase.
#
# Keys are normative and come from en.yaml — do not rename, do not omit.
#
# Markers:
#   `# TODO: review`   — drafted here, not written by a native speaker. Reads
#                        correctly but the register may not be what the
#                        therapist would say. Check before launch.
#   `# TODO: …`        — anything else still open on that line.
#   unmarked           — carried over from the v1.0 deployment, with Telegram
#                        HTML tags and layout emoji stripped (see §15).
#
# Sentence-final punctuation is `։` (U+0589) on drafted lines. The v1.0 copy
# uses a plain `:` in places; that is worth normalising when someone reviews.


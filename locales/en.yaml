# locales/en.yaml
#
# NORMATIVE KEY CATALOGUE. This file defines the key names for the whole service.
# ru.yaml and hy.yaml MUST contain exactly the same keys.
#
# Rules (see IMPLEMENTATION.md §15):
#   - No markup in values. No <b>, no HTML, no Markdown emphasis. The renderer
#     decides emphasis per channel. Emoji are allowed but should be sparing.
#   - Placeholders are str.format names: {time}, {uuid}, {price}, ...
#   - Practice policy (working hours, terms, cancellation rules) does NOT belong
#     here. That is a content block the therapist edits.
#   - Adding a key means adding it to all three locale files in the same change.
#
# English is the admin language and the reference copy for translators.
# Client-facing English strings exist so `en` is a usable fallback, not because
# clients are expected to use it.

lang:
  select: "Please choose a language."
  name.ru: "Русский"
  name.hy: "Հայերեն"
  name.en: "English"

common:
  skip: "Skip"
  back: "Back"
  cancel: "Cancel"
  home: "Home"
  yes: "Yes"
  no: "No"
  continue: "Continue"
  open: "Open"
  welcome: "Welcome."
  welcome_back: "You are back at the main menu."
  error.generic: "Something went wrong. Please try again a little later."
  error.expired_link: "This link has expired. Please request a new one."
  error.not_found: "That was not found."
  error.rate_limited: "Too many attempts. Please try again later."

# Day and month names for the slot pickers. Abbreviated on purpose: a full
# month name has to decline in Russian and Armenian ("27 августа", not
# "27 август"), and a format string cannot know that. Abbreviations are
# case-neutral in all three languages. `weekday` is Monday-indexed, as
# `datetime.weekday()` counts.
date:
  weekday.0: "Mon"
  weekday.1: "Tue"
  weekday.2: "Wed"
  weekday.3: "Thu"
  weekday.4: "Fri"
  weekday.5: "Sat"
  weekday.6: "Sun"
  month.1: "Jan"
  month.2: "Feb"
  month.3: "Mar"
  month.4: "Apr"
  month.5: "May"
  month.6: "Jun"
  month.7: "Jul"
  month.8: "Aug"
  month.9: "Sep"
  month.10: "Oct"
  month.11: "Nov"
  month.12: "Dec"
  day: "{weekday} {day} {month}"


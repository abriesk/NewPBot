{% extends "base.html" %}
{% block title %}{{ t.sign_in }} — {{ practice.name }}{% endblock %}
{% block content %}
{% if sent %}
  <div class="card notice" role="status">
    <h1>{{ t.sign_in }}</h1>
    <p>{{ t.link_sent }}</p>
    <div class="stack-actions"><a class="link-back" href="/">{{ t.home }}</a></div>
  </div>
{% else %}
  <div class="page-head">
    <h1>{{ t.sign_in }}</h1>
  </div>
  <form method="post" action="/auth/email" class="card">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label>{{ t.email_label }}
      <input type="email" name="email" required autocomplete="email" inputmode="email" value="{{ values.email or '' }}"
             {% if errors.email %}aria-invalid="true" aria-describedby="email-error"{% endif %}>
      {% if errors.email %}<span class="field-error" id="email-error" role="alert">{{ errors.email }}</span>{% endif %}
    </label>
    <button type="submit">{{ t.send_link }}</button>
  </form>
{% endif %}
{% endblock %}

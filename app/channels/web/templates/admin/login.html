<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ t.login_title }}</title>
<link rel="stylesheet" href="/static/style.css">
{# The sign-in page is the console too. It offers no control -- there is
   nothing to configure before signing in -- but it honours a choice already
   made, so logging out is not a flash back to the wrong palette. #}
<script>
try {
  var saved = localStorage.getItem('admin-guide-theme');
  if (saved === 'dark' || saved === 'light') {
    document.documentElement.dataset.theme = saved;
  }
} catch (e) { /* storage blocked: the system preference still applies */ }
</script>
</head>
<body>
<main>
  <h1>{{ t.login_title }}</h1>
  {% if failed %}<p class="error">{{ t.login_failed }}</p>{% endif %}
  <form method="post" action="/admin/login" class="card">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label>Username <input type="text" name="username" autocomplete="username" required></label>
    <label>Password
      <input type="password" name="password" autocomplete="current-password" required>
    </label>
    <button type="submit">{{ t.login_title }}</button>
  </form>
</main>
</body>
</html>

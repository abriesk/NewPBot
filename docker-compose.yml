# One image, three application services (DESIGN.md §3.3). Profiles select the
# ingress; see IMPLEMENTATION.md §16.1.
#
#   tls   (default)  caddy + web + worker + db  -- Caddy terminates TLS
#   plain            web + worker + db          -- something else terminates TLS
#   plain,cloudflared  above plus a Cloudflare Tunnel, no inbound ports

# Shared by every service (NP3): a container's log is capped at three 10 MB files
# instead of growing until the disk is full.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# No capability and no privilege escalation, for the services that start without
# either. The two that run as root to fix ownership (db, backup) add back only
# what that takes.
x-hardened: &hardened
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]

services:
  db:
    <<: *hardened
    # What the entrypoint needs to chown and then drop to the postgres user.
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    image: postgres:16
    # Time limits (NP3): a stuck client cannot hold a lock or a transaction open
    # for ever, and a runaway query is cut off. pg_dump sets its own statement
    # timeout, and alembic/env.py lifts all three for the migration connection.
    # Bound parameters are kept out of the slow-query log: they are client data.
    command:
      - postgres
      - -c
      - idle_in_transaction_session_timeout=60s
      - -c
      - lock_timeout=10s
      - -c
      - statement_timeout=30s
      - -c
      # The slow-query log stays (500 ms) but without values: the app binds every value as a
      # parameter, so the statement text carries $1, $2 ...; the two settings below stop the
      # parameters being written beside it (PostgreSQL 13+; 0 = never), also on error.
      - log_min_duration_statement=500
      - -c
      - log_parameter_max_length=0
      - -c
      - log_parameter_max_length_on_error=0
    mem_limit: 512m
    logging: *logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-psychobooking}
      POSTGRES_USER: ${POSTGRES_USER:-psycho}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
    volumes:
      # A bare name is the named volume below; a path (`./pgdata`) bind-mounts a
      # host directory instead, so a stopped stack moves as one folder copy.
      - ${PGDATA_DIR:-pgdata}:/var/lib/postgresql/data
    healthcheck:
      # §16.3 specifies `pg_isready`. That only asks whether the server is
      # accepting connections: it returns 0 even for a database that does not
      # exist, and the entrypoint runs initdb on a socket-only server, so it can
      # report healthy before POSTGRES_DB and POSTGRES_USER have been created.
      # `psql` authenticates and resolves the database, which is what `web`
      # needs to be true before it runs `alembic upgrade head`.
      test: ["CMD-SHELL", "psql -U $${POSTGRES_USER:-psycho} -d $${POSTGRES_DB:-psychobooking} -c 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  web:
    <<: *hardened
    build: .
    env_file: .env
    environment:
      # Where the caller's address is read from (C2). `X-Forwarded-For` suits
      # Caddy and any one proxy that appends; the cloudflared overlay sets
      # `CF-Connecting-IP`. uvicorn itself trusts no forwarded header.
      CLIENT_IP_HEADER: ${CLIENT_IP_HEADER:-X-Forwarded-For}
    mem_limit: 512m
    logging: *logging
    # `exec` so uvicorn is PID 1 and gets SIGTERM: under `sh -c` the signal died
    # in the shell and every stop waited out the grace period (F13).
    stop_grace_period: 60s
    depends_on:
      db:
        condition: service_healthy
    # Migrate, then seed (§20; idempotent), then serve. web is the only
    # process that does either -- worker waits on its healthcheck (§16.5).
    command: >
      sh -c "alembic upgrade head &&
             python -m app.seed &&
             exec uvicorn app.main:app --host 0.0.0.0 --port 8000"
    expose:
      - "8000"
    # Read-only on purpose: the admin UI lists and downloads dumps, and there
    # is no route that writes, deletes, or restores one (DESIGN.md §21.5).
    volumes:
      - ${BACKUP_DIR:-./backups}:/backups:ro
      - ${STATE_DIR:-./state}:/state:ro
    # No published ports here. Under `tls`, Caddy is the sole ingress and web is
    # reachable only on the internal network. Under `plain`, the loopback
    # binding comes from docker-compose.plain.yml.
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request;urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  worker:
    <<: *hardened
    build: .
    env_file: .env
    mem_limit: 384m
    logging: *logging
    stop_grace_period: 60s
    depends_on:
      web:
        condition: service_healthy
    command: ["python", "-m", "app.worker.main"]
    # The worker writes the health file (§16.8) and reads the dump directory to
    # check its freshness and the disk under it (§16.9) -- read-only there,
    # because the sidecar owns those files.
    volumes:
      - ${STATE_DIR:-./state}:/state
      - ${BACKUP_DIR:-./backups}:/backups:ro
    restart: unless-stopped

  # Nightly pg_dump into a directory bind-mounted from the host (§16.6). Not
  # behind a profile: profiles select the ingress, and a backup that has to be
  # switched on is a backup most installs do not have. Same image as db, so
  # pg_dump can never be older than the server it dumps.
  backup:
    <<: *hardened
    # chown and chmod of a 0700 directory owned by another uid, as root.
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
    image: postgres:16
    logging: *logging
    depends_on:
      db:
        condition: service_healthy
    # Only what backup.sh reads (F14) -- not the whole .env, which holds the
    # session key, the bot token and the admin password.
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?required}
      POSTGRES_USER: ${POSTGRES_USER:-psycho}
      POSTGRES_DB: ${POSTGRES_DB:-psychobooking}
      BACKUP_HOUR_UTC: ${BACKUP_HOUR_UTC:-3}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
    volumes:
      - ./backup.sh:/backup.sh:ro
      - ${BACKUP_DIR:-./backups}:/backups
    entrypoint: ["/bin/sh", "/backup.sh"]
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    profiles: ["tls"]
    logging: *logging
    environment:
      # Soft defaults on purpose: Compose interpolates every service before it
      # filters by profile, so a hard `:?` here would force a tunnel-only
      # operator -- who has no domain at all -- to invent one. The requirement
      # is enforced below instead, where it actually applies.
      DOMAIN: ${DOMAIN:-}
      ACME_EMAIL: ${ACME_EMAIL:-}
    # Fail loudly rather than let Caddy fall back to serving plain HTTP on :80
    # for every host, which is exactly the exposure §16.1 warns about.
    command: >
      sh -c '[ -n "$$DOMAIN" ] || { echo "FATAL: DOMAIN is required by the tls profile. Set it in .env, or use the plain profile."; exit 1; };
             [ -n "$$ACME_EMAIL" ] || { echo "FATAL: ACME_EMAIL is required by the tls profile. Set it in .env."; exit 1; };
             exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - web
    restart: unless-stopped

volumes:
  pgdata:
  caddy_data:
  caddy_config:
